{% set name = "rocfft" %}
{% set version = "7.2.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/ROCm/rocm-libraries/releases/download/rocm-{{ version }}/rocfft.tar.gz
  sha256: c37e25e7a4f09a1064c53b93b14c14cb7400f046405ea0ef3ea1f4b4a80d7528
  patches:
    - 0001-Fix-mman-include-for-MADV_HUGEPAGE.patch

build:
  number: 0
  skip: True  # [not linux]
  run_exports:
    - {{ pin_subpackage(name, max_pin='x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('hip') }}
    - cmake
    - pkg-config
    - ninja
  host:
    - rocm-core {{ version }}.*
    - rocm-cmake
    - sqlite

test:
  commands:
    - test -f $PREFIX/include/rocfft/rocfft.h
    - test -f $PREFIX/lib/librocfft.so
    - test -f $PREFIX/lib/cmake/rocfft/rocfft-config.cmake

about:
  home: https://rocm.docs.amd.com/projects/rocFFT
  summary: ROCm Fast Fourier Transform (FFT) library
  description: |
    rocFFT is a software library for computing fast Fourier transforms (FFTs)
    written in the HIP programming language. It's part of AMD's software ecosystem
    based on ROCm. The rocFFT library can be used with AMD and NVIDIA GPUs.
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  doc_url: https://rocm.docs.amd.com/projects/rocFFT/en/latest/
  dev_url: https://github.com/ROCm/rocm-libraries/tree/develop/projects/rocfft

extra:
  recipe-maintainers:
    - zklaus
